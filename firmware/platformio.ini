[env:heltec_s3_devkit]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

; NOTE: Heltec WiFi LoRa 32 V4 is the intended development board.
; The PlatformIO board name is assumed to be a generic ESP32-S3 dev board.
; Update board = <exact-board-id> when the correct Heltec V4 board ID is confirmed.

lib_deps =
  adafruit/Adafruit NeoPixel
  pololu/VL53L1X
  jgromes/RadioLib @ ^7.7.1
