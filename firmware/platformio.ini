[platformio]
default_envs = heltec_s3_devkit

[env:heltec_s3_devkit]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_F8:5B:1B:BF:02:A8-if00

upload_speed = 921600
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_F8:5B:1B:BF:02:A8-if00

build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

build_src_filter =
  +<*>
  -<apps/listener/*>

lib_deps =
  adafruit/Adafruit NeoPixel
  pololu/VL53L1X
  jgromes/RadioLib @ ^7.7.1


[env:heltec_v4_listener]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_A4:CB:8F:A6:78:F4-if00

upload_speed = 921600
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_A4:CB:8F:A6:78:F4-if00

build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

build_src_filter =
  -<*>
  +<apps/listener/main.cpp>
  +<fw_radio_profile.cpp>
  +<fw_radio_channel.cpp>
  +<fw_packet.cpp>

lib_deps =
  jgromes/RadioLib @ ^7.7.1
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306

; BEGIN FARMWHISPER HELTEC V4 COOP BLE CAPTURE
[env:heltec_v4_coop_ble_capture]
extends = env:heltec_v4_listener

build_src_filter =
  -<*>
  +<apps/coop_station_ble_decode/main.cpp>
  +<fw_ble_telemetry.cpp>
  +<fw_packet.cpp>

lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
; END FARMWHISPER HELTEC V4 COOP BLE CAPTURE

; BEGIN FARMWHISPER HELTEC V4 COOP STATION
[env:heltec_v4_coop_station]
extends = env:heltec_v4_listener

build_src_filter =
  -<*>
  +<apps/coop_station_bridge/main.cpp>
  +<fw_ble_telemetry.cpp>
  +<fw_packet.cpp>
  +<fw_radio.cpp>
  +<fw_radio_profile.cpp>
  +<fw_radio_channel.cpp>
  +<fw_device_config.cpp>
  +<fw_transport_mode.cpp>

lib_deps =
  jgromes/RadioLib @ ^7.7.1
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
; END FARMWHISPER HELTEC V4 COOP STATION

; BEGIN FARMWHISPER XIAO S3 COOP STATION HARDWARE PORT
[env:xiao_s3_coop_station]
extends = env:heltec_v4_coop_station

build_flags =
  ${env:heltec_v4_listener.build_flags}
  -D FW_COOP_STATION_XIAO_S3_WIO_SX1262=1

monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_90:70:69:10:C0:50-if00
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_90:70:69:10:C0:50-if00
; END FARMWHISPER XIAO S3 COOP STATION HARDWARE PORT



; BEGIN FARMWHISPER XIAO ESP32-C6 TOF HARDWARE PORT
[env:xiao_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino

monitor_speed = 115200
upload_speed = 460800

board_build.partitions = huge_app.csv

build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D FW_BOARD_XIAO_C6=1

build_src_filter =
  +<*>
  -<apps/*>
  -<fw_radio.cpp>
  -<fw_battery.cpp>
  -<fw_expansion_gpio.cpp>

lib_deps =
  adafruit/Adafruit NeoPixel
  pololu/VL53L1X
; END FARMWHISPER XIAO ESP32-C6 TOF HARDWARE PORT
